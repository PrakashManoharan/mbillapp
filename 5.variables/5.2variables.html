<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      let variableName = 'Prakash';
      let variableCount = 0;

      variableName = 'Prakash Manoharan';
      variableCount++;
      console.log(`variableName ${variableName}`);
      console.log(`variableCount ${variableCount}`);

      const variable1 = 'Prakash';
      const resultVariable = `${variable1} Manoharan`;
      console.log(`variable1 ${variable1}`);
      console.log(`resultVariable ${resultVariable}`);

      var variable2 = 'Prakash';
      console.log(`variable2 ${variable2}`);
      variable2 = 'Prakash Manoharan';
      console.log(`variable2 ${variable2}`);
    </script>
  </body>
</html>

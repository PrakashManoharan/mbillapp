<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      const name = 'Prakash';
      const coffee = 5;
      const bagle = 3;
      const soup = 9;

      let cost = 0;

      console.log(`Name: ${name}`);
      cost = coffee * 1 + bagle * 2 + soup * 1;
      console.log(`Cost: ${cost}`);
      const tax = cost * 0.1;
      console.log(`Tax: ${tax}`);
      const TotalCost = cost + tax;
      console.log(`TotalCost: ${TotalCost}`);
    </script>
  </body>
</html>
